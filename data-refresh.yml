name: Replenish data and clean expired records
on:
  workflow_dispatch:
  schedule:
    # 台灣 03:41 / 09:41 / 15:41 / 21:41，每日執行；不發送LINE通知。
    - cron: '41 1,7,13,19 * * *'
permissions:
  contents: read
concurrency:
  group: lighthouse-scan
  cancel-in-progress: false
jobs:
  replenish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_TOKENS_JSON: ${{ secrets.USER_TOKENS_JSON }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANNUAL_SYMBOLS: ${{ vars.ANNUAL_SYMBOLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Validate shared database
        run: python -c "import os; assert os.environ.get('DATABASE_URL','').startswith(('postgres','postgresql')), 'Set PostgreSQL DATABASE_URL secret'"
      - name: Replenish in bounded independent batches
        timeout-minutes: 5
        run: python -m jobs.refresh_data
