name: Agent PostgreSQL isolation
on:
  push:
    branches: [feature/ai-agent-manager]
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agent_test
          POSTGRES_PASSWORD: agent_test
          POSTGRES_DB: agent_isolated
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U agent_test -d agent_isolated"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_agent_postgres_isolation.py
        env:
          AGENT_PG_ISOLATED_CI: '1'
