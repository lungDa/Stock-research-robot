name: Read-only annual public name format
on:
  push:
    branches: [diagnose/annual-public-name-format]
    paths: [.github/workflows/annual-public-name-format.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Observe public company metadata
        run: |
          python -m scripts.check_tw_financial_contract --symbol 6488.TWO
