name: Read-only annual public name format
on:
  push:
    branches: [diagnose/annual-public-name-format]
    paths: [.github/workflows/annual-public-name-format.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Observe public company metadata
        run: |
          python - <<'PY'
          import ast, inspect, re
          from datetime import date
          from app.providers import mopsfin
          from app.providers.source_errors import describe
          errors = {node.args[0].value for node in ast.walk(ast.parse(inspect.getsource(mopsfin)))
                    if isinstance(node, ast.Call) and isinstance(node.func, ast.Name)
                    and node.func.id == 'ValueError' and node.args and isinstance(node.args[0], ast.Constant)
                    and isinstance(node.args[0].value, str)}
          stage = 'catalog'
          try:
              catalog = mopsfin.parse_catalog(mopsfin.request('/'))
              stage = 'company'
              display = mopsfin.parse_company(mopsfin.request('/suggestCompany', params={'query':'6488'}), '6488.TWO')
              for field in ('eps', 'roe_pct'):
                  stage = field
                  body = mopsfin.request('/compare/data', form=mopsfin.annual_fields(field, display, catalog[field]))
                  extra = body.get('extraNameList')
                  known = {'產業平均','同業平均','公司平均','上市平均','上櫃平均','全體平均',''}
                  print(field, 'extraNameList shape:', type(extra).__name__,
                        'entries:', [(type(x).__name__, mopsfin.clean(x) if isinstance(x,str) and re.fullmatch(r'[0-9A-Za-z\u3400-\u9fff ()（）.－-]{1,80}', mopsfin.clean(x)) else '[other]') for x in extra[:10]] if isinstance(extra,list) else None,
                        'graph series:', len(body.get('graphData', [])))
                  rows = mopsfin.parse_annual(body, '6488.TWO', field, display, date.today(), catalog[field])
                  print(field, 'verified years', sorted(rows))
          except Exception as exc:
              print(describe(exc, stage), 'fixed_reason:', str(exc) if str(exc) in errors else type(exc).__name__)
              raise SystemExit(1)
          PY
