name: Verify TPEx EPS in isolated Neon schema
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v25-final-isolated-migration
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Confirm test host and verify market-wide EPS write
        env:
          DATABASE_URL: ${{ secrets.NEON_V25_FINAL_TEST_DATABASE_URL }}
          EXPECTED_TEST_HOST: ${{ vars.NEON_V25_FINAL_TEST_HOST }}
        run: |
          python - <<'PY'
          import os
          from time import monotonic
          from urllib.parse import parse_qs, urlsplit
          from uuid import uuid4

          url = urlsplit(os.environ.get("DATABASE_URL", ""))
          host = (url.hostname or "").lower()
          expected = os.environ.get("EXPECTED_TEST_HOST", "").strip().lower()
          if (
              not expected or host != expected or not host.endswith(".neon.tech")
              or host.split(".")[0].removesuffix("-pooler") == "ep-steep-night-a14wn335"
              or url.scheme not in ("postgresql", "postgres", "postgresql+psycopg")
              or url.path != "/neondb"
              or parse_qs(url.query).get("sslmode") not in (["require"], ["verify-full"])
          ):
              raise SystemExit("Test host, database or TLS guard rejected the configuration")

          from sqlalchemy import event
          from app.db import engine, get
          from jobs import refresh_tpex_eps

          schema = "tpex_test_" + uuid4().hex
          try:
              with engine.begin() as conn:
                  conn.exec_driver_sql(f'CREATE SCHEMA "{schema}"')
          except Exception as exc:
              raise SystemExit(f"Test connection or schema creation failed ({type(exc).__name__})") from None

          def set_test_schema(conn):
              conn.exec_driver_sql(f'SET LOCAL search_path TO "{schema}"')
              if conn.exec_driver_sql("SELECT current_schema()").scalar_one() != schema:
                  raise RuntimeError("Isolated schema check failed")

          event.listen(engine, "begin", set_test_schema)
          try:
              started = monotonic()
              result = refresh_tpex_eps.run()
              if result.get("state") != "updated":
                  raise SystemExit(f"Worker did not update: {result}")
              rows = get("eps:official:6488.TWO", {}).get("rows", {})
              assert str(result["year"]) in rows
              assert rows[str(result["year"])]["field_sources"]["eps"]["provenance"] == refresh_tpex_eps.PROVENANCE
              assert result["updated"] == result["rows"] > 0
              print(f'Neon write verified: year={result["year"]}, rows={result["rows"]}, seconds={monotonic()-started:.2f}')
          finally:
              event.remove(engine, "begin", set_test_schema)
              with engine.begin() as conn:
                  conn.exec_driver_sql(f'DROP SCHEMA "{schema}" CASCADE')
              print("Temporary test schema removed")
              engine.dispose()
          PY
