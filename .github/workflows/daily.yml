name: Daily scan and digest
on:
  workflow_dispatch:
  schedule:
    # UTC 06:17 = 台灣14:17；美股採前一交易日資料，每日一份合併摘要。
    - cron: '17 6 * * 1-5'
permissions:
  contents: read
concurrency:
  group: lighthouse-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_TOKENS_JSON: ${{ secrets.USER_TOKENS_JSON }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate shared database
        run: python -c "import os; assert os.environ.get('DATABASE_URL','').startswith(('postgres','postgresql')), 'Set PostgreSQL DATABASE_URL secret'"
      - name: Refresh market universe
        run: python -m jobs.refresh_universe
      - name: Scan tracked symbols and rotating market batch
        run: python -m jobs.scan --limit 200 --seconds 900
      - name: Send opted-in digest
        run: python -m jobs.notify
