name: V2.5 production database migration (manual only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type MIGRATE-V25-PRODUCTION to authorize production schema changes'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: v25-production-migration
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirmation == 'MIGRATE-V25-PRODUCTION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: v25-production-migration
    env:
      DATABASE_URL: ${{ secrets.NEON_V25_PRODUCTION_DATABASE_URL }}
      EXPECTED_PRODUCTION_HOST: ${{ vars.NEON_V25_PRODUCTION_HOST }}
    steps:
      - name: Checkout V2.5 revision validated on isolated branch
        uses: actions/checkout@v4
        with:
          ref: 31f0d4ec9fa78b8f2816a7fbd628bff8edd71869
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Validate production endpoint and migrate without altering legacy rows
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from urllib.parse import urlsplit, parse_qs
          from sqlalchemy import inspect, text

          url = os.environ.get("DATABASE_URL", "")
          expected = os.environ.get("EXPECTED_PRODUCTION_HOST", "").strip().lower()
          parsed = urlsplit(url)
          host = (parsed.hostname or "").lower()
          production_endpoint = "ep-steep-night-a14wn335"
          if not expected or host != expected or not host.endswith(".neon.tech"):
              raise SystemExit("FAIL CLOSED: configured production hostname mismatch")
          if host.split(".")[0].removesuffix("-pooler") != production_endpoint:
              raise SystemExit("FAIL CLOSED: connection is not the approved production endpoint")
          if parsed.path != "/neondb" or parsed.scheme not in ("postgresql", "postgres", "postgresql+psycopg"):
              raise SystemExit("FAIL CLOSED: unexpected database target")
          if "require" not in parse_qs(parsed.query).get("sslmode", []):
              raise SystemExit("FAIL CLOSED: TLS required")

          from app.db import Base, engine, init_db
          legacy = ("documents", "preferences", "provider_budgets", "watchlist", "worker_leases")
          def snapshot():
              result = {}
              with engine.connect() as conn:
                  inspector = inspect(conn)
                  for name in legacy:
                      pk = inspector.get_pk_constraint(name, schema="public")["constrained_columns"]
                      if not pk:
                          raise RuntimeError("Missing legacy primary key: " + name)
                      order = ", ".join('"' + col.replace('"', '""') + '"' for col in pk)
                      rows = conn.execute(text('SELECT * FROM "' + name + '" ORDER BY ' + order)).mappings()
                      digest = hashlib.sha256()
                      count = 0
                      for row in rows:
                          digest.update(json.dumps(dict(row), sort_keys=True, default=str, ensure_ascii=False).encode())
                          digest.update(b"\\n")
                          count += 1
                      result[name] = (count, digest.hexdigest())
              return result

          before = snapshot()
          if {k: v[0] for k, v in before.items()} != {
              "documents": 589, "preferences": 1, "provider_budgets": 10,
              "watchlist": 1, "worker_leases": 0
          }:
              raise SystemExit("FAIL CLOSED: production row counts differ from approved baseline")
          existing = set(inspect(engine).get_table_names(schema="public"))
          if not set(legacy).issubset(existing):
              raise SystemExit("FAIL CLOSED: missing legacy tables")
          if len(Base.metadata.tables) != 17:
              raise SystemExit("FAIL CLOSED: unexpected V2.5 model table count")
          print("Preflight passed. Legacy counts:", {k: v[0] for k, v in before.items()})
          init_db()
          after = snapshot()
          if before != after:
              raise SystemExit("FAIL: legacy row content changed")
          actual = set(inspect(engine).get_table_names(schema="public"))
          missing = set(Base.metadata.tables) - actual
          if missing:
              raise SystemExit("FAIL: missing tables: " + str(sorted(missing)))
          print("PASS: 17 mapped tables present and 5 legacy tables unchanged by SHA256")
          PY
