name: Backfill free defensive history
on:
  schedule:
    - cron: '43 */2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lighthouse-defensive-risk
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Advance benchmark coverage
        run: |
          python -c "from app.db import engine; assert engine.dialect.name == 'postgresql'"
          python -m jobs.maintenance_guard
          python -m jobs.refresh_defensive_inputs
      - name: Advance two verified market symbols
        run: |
          python -m jobs.maintenance_guard
          python -m jobs.refresh_defensive_universe
