name: Personal market top 10
on:
  schedule:
    # UTC +8 = Taipei 11:30 / 19:30; Python checks exchange calendar.
    - cron: '30 3 * * 1-5'
    - cron: '30 11 * * 1-5'
    # Same-day retries recover missing/delayed runs; sent outboxes are skipped.
    - cron: '7,37 4-15 * * 1-5'
  # Other successful scheduling pathways also wake the same due-report worker.
  workflow_run:
    workflows:
      - Check Render backend every 10 minutes (best effort)
      - Check Render and Streamlit (best effort)
      - Daily scan and digest
      - Replenish data and clean expired records
      - V2.6 Taiwan financial background backfill
      - V2.6.4 Verified market paid-dividend backfill
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      slot:
        description: 'auto = due reports; morning = previous session close; evening = today close'
        type: choice
        options: [auto, morning, evening]
        default: auto
      send:
        description: 'Actually send LINE (unchecked = preview only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: lighthouse-recommendations
  cancel-in-progress: false
jobs:
  recommend:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 27
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_TOKENS_JSON: ${{ secrets.USER_TOKENS_JSON }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || secrets.PUBLIC_APP_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      RANKING_SLOT: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'auto' || inputs.slot || 'evening' }}
      SEND_RANKING: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.send }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Validate shared database
        run: python -c "import os; assert os.environ.get('DATABASE_URL','').startswith(('postgres','postgresql'))"
      - name: Send daily watchlist report
        if: github.event_name == 'schedule' || inputs.send
        run: |
          python -m jobs.maintenance_guard
          python -m jobs.watch_digest
      - name: Build personal market recommendations
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          args=(--slot "$RANKING_SLOT")
          if [ "$SEND_RANKING" = "true" ]; then args+=(--send); fi
          python -m jobs.maintenance_guard
          python -m jobs.recommend "${args[@]}"
