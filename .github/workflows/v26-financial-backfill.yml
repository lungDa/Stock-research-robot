name: V2.6 Taiwan financial background backfill
on:
  workflow_dispatch:
  schedule:
    # Every 30 minutes UTC = every 30 minutes in Taiwan.
    - cron: '0,30 * * * *'
permissions:
  contents: read
concurrency:
  group: lighthouse-scan
  cancel-in-progress: false
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USER_TOKENS_JSON: ${{ secrets.USER_TOKENS_JSON }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      ANNUAL_SYMBOLS: ${{ vars.ANNUAL_SYMBOLS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Validate shared database and maintenance state
        run: |
          python -c "import os; assert os.environ.get('DATABASE_URL','').startswith(('postgres','postgresql')), 'Set PostgreSQL DATABASE_URL secret'"
          python -m jobs.maintenance_guard
      - name: Check adaptive time window
        id: window
        shell: bash
        run: |
          set +e
          python -m jobs.v26_backfill_window
          status=$?
          if [ "$status" -eq 10 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"
      - name: Audit listed and OTC ordinary-stock universe
        if: steps.window.outputs.run != 'false'
        timeout-minutes: 2
        continue-on-error: true
        run: python -m jobs.v26_universe_audit
      - name: Update partial market completeness diagnostic
        if: steps.window.outputs.run != 'false'
        timeout-minutes: 2
        continue-on-error: true
        run: python -m jobs.v26_market_coverage
      - name: Refresh official annual EPS and ROE (bounded)
        if: steps.window.outputs.run != 'false'
        timeout-minutes: 2
        run: python -m jobs.refresh_tw_financials
      - name: Refresh annual cash dividend totals (bounded)
        if: steps.window.outputs.run != 'false'
        timeout-minutes: 2
        run: python -m jobs.refresh_cash_dividends
