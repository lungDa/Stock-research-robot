name: Defensive benchmark pilot backfill
on:
  push:
    branches: [diagnose/defensive-pilot-backfill]
    paths: [.github/workflows/defensive-pilot-backfill.yml]
permissions:
  contents: read
concurrency:
  group: lighthouse-defensive-risk
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Refresh bounded risk benchmarks and historical calendar
        run: |
          python -c "from app.db import engine; assert engine.dialect.name == 'postgresql'"
          python -m jobs.maintenance_guard
          python -m jobs.refresh_defensive_inputs
      - name: Check readiness without sending LINE
        run: python -m jobs.audit_defensive_readiness --samples 1
