name: Free defensive history pilot
on:
  push:
    branches: [diagnose/defensive-pilot-backfill]
    paths: [.github/workflows/defensive-pilot-backfill.yml]
permissions:
  contents: read
concurrency:
  group: lighthouse-defensive-risk
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --disable-pip-version-check -r requirements-worker.txt
      - name: Advance one free history window without LINE or paid data
        run: |
          python -c "from app.db import engine; assert engine.dialect.name == 'postgresql'"
          python -m jobs.maintenance_guard
          python - <<'PY'
          from jobs.refresh_defensive_history import run, STAGING, DATASET, FEEDS, PREFIX
          from app.db import get
          from jobs.maintenance_guard import assert_writable
          for _ in range(12):
              assert_writable()
              result = run(['2330.TW'])
              print(result, flush=True)
              item = result.get('symbols', {}).get('2330.TW', {})
              if item.get('state') != 'backfilling' or item.get('reason'):
                  break
          for feed in (DATASET, *FEEDS):
              state = get(STAGING + '2330.TW:' + feed, {})
              print({'feed':feed, 'records':len(state.get('records', [])),
                     'verified_windows':state.get('coverage_windows', [])}, flush=True)
          published = get(PREFIX + '2330.TW', {})
          print({'published_date':published.get('as_of'),
                 'adjusted_rows': len(published.get('rows', [])),
                 'coverage':published.get('coverage')}, flush=True)
          PY
