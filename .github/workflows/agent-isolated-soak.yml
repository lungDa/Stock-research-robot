name: Agent isolated soak
on:
  push:
    branches: [feature/ai-agent-manager]
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q -s tests/test_agent_resource_stability.py
        env:
          AGENT_SOAK_CI: '1'
